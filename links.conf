# dlink.sh manifest. One entry per line:  <kind>  <repo path>  <target>  [mode]
#   link      symlink as you          (target gets replaced by a link; a real file is kept as <target>.pre-dlink-<date>)
#   rootlink  symlink as root         (only with dlink.sh --root)
#   rootcopy  root-owned copy, <mode> (only with dlink.sh --root; for systemd units / polkit rules, which must not
#                                       point into a user-writable repo)
# Whole-dir links: for apps that save by replacing files (KConfig/Qt), link the directory, not each file.

# shell / terminal
link      configs/zsh/.zshrc                     ~/.zshrc
link      configs/tmux/.tmux.conf                ~/.tmux.conf
link      configs/tmux/cheatsheet.sh             ~/.config/tmux/cheatsheet.sh
link      configs/tmux/claude-resurrect.sh       ~/.config/tmux/claude-resurrect.sh
link      configs/x11/.xinitrc                   ~/.xinitrc
link      configs/nvim/init.vim                  ~/.config/nvim/init.vim

# desktop
link      configs/hypr/hyprland.conf             ~/.config/hypr/hyprland.conf
link      configs/hypr/conf.d                    ~/.config/hypr/conf.d
link      configs/hypr/scripts                   ~/.config/hypr/scripts
link      configs/mako/config                    ~/.config/mako/config
link      configs/waybar/config.jsonc            ~/.config/waybar/config.jsonc
link      configs/waybar/hardware.json           ~/.config/waybar/hardware.json
link      configs/waybar/media.json              ~/.config/waybar/media.json
link      configs/waybar/modules.json            ~/.config/waybar/modules.json
link      configs/waybar/quicklinks.json         ~/.config/waybar/quicklinks.json
link      configs/waybar/style.css               ~/.config/waybar/style.css
link      configs/easyeffects/db                 ~/.config/easyeffects/db

# pcpanel
link      configs/pcpanel/pcpanel                ~/.local/bin/pcpanel
rootcopy  configs/pcpanel/system/pcpanel-ssd-uncap.service  /etc/systemd/system/pcpanel-ssd-uncap.service  644
rootcopy  configs/pcpanel/system/50-pcpanel.rules           /etc/polkit-1/rules.d/50-pcpanel.rules         644

# root shell
rootlink  configs/zsh/.zshrc                     /root/.zshrc
rootlink  configs/tmux/.tmux.conf                /root/.tmux.conf
