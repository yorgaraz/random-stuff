map ctrl+up launch sh -c "~/.config/hypr/scripts/resize-quake.sh up"
map ctrl+down launch sh -c "~/.config/hypr/scripts/resize-quake.sh down"

map ctrl+shift+up launch sh -c "~/.config/hypr/scripts/resize-quake.sh up fast"
map ctrl+shift+down launch sh -c "~/.config/hypr/scripts/resize-quake.sh down fast"

map f1 launch vi .
map f11 launch --type=background sh -c "~/.config/hypr/scripts/toggle-fullscreen.sh"

