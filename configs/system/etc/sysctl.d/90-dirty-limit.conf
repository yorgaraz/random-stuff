# btrfs-diag C11 (2026-11-02): small write-back buffer while the root NVMe is capped at PS1 (~62 MB/s writes).
# The default (20 % / 10 % of RAM, ~7 GB) let one big writer (Steam) jam every fs sync for ~15 min on 11-02.
# 256 MB at ~62 MB/s = ~4 s to flush. Remove this file when the cap goes.
vm.dirty_bytes = 268435456
vm.dirty_background_bytes = 67108864
