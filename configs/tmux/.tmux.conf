set -g mouse on
set -g set-clipboard on
set -g history-limit 100000
set -g default-terminal "screen-256color"
set -g base-index 1
set -g pane-base-index 1
set -g status-interval 1
set -g set-titles on
set -g automatic-rename on
set -g status-left ""
set -g status-right "#[fg=#7f849c,nobold] #S  #[default] %d-%b-%y   %H:%M "
set -g status-right-length 100
# Clickable "?" pinned to the far right of the status bar -> opens the cheatsheet popup
set -ag status-right "#[range=user|cheat,fg=#cba6f7,bold]  ? #[norange,default]"

# Click session name / date / time -> session switcher
# -G + the rcterm-* filter: tmux 3.7c draws a BLANK tree when a session group's hidden twin
# (the rcmenu in-game terminal's rcterm-* session) is the newest session (2026-10-29).
bind -n MouseDown1StatusRight choose-tree -GZs -f "#{?#{m:rcterm-*,#{session_name}},0,1}"
bind s choose-tree -GZs -f "#{?#{m:rcterm-*,#{session_name}},0,1}"
bind w choose-tree -GZw -f "#{?#{m:rcterm-*,#{session_name}},0,1}"
# The "?" is a user range, so it fires the generic Status key: branch to the cheatsheet
# popup when that range is clicked, otherwise keep the default window-list click behavior.
bind -n MouseDown1Status if -F "#{==:#{mouse_status_range},cheat}" "display-popup -E -w 88% -h 88% -b rounded -T ' tmux cheatsheet ' ~/.config/tmux/cheatsheet.sh" "switch-client -t ="
bind J command-prompt -p "join pane from window:" "join-pane -s ':%%'"
bind S command-prompt -p "send pane to window:" "join-pane -t ':%%'"

# Preserve Wayland/X11 environment variables for Hyprland compatibility
set-option -g update-environment " \
    XDG_SESSION_TYPE \
    WAYLAND_DISPLAY \
    DISPLAY \
    HYPRLAND_INSTANCE_SIGNATURE \
    SSH_AUTH_SOCK \
    XAUTHORITY \
    "

# X11
#set-option -g command-alias XC="run-shell 'tmux save-buffer - | xclip -selection clipboard -i > /dev/null'"
#bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "xclip -selection clipboard -i > /dev/null"

# WAYLAND
set-option -g command-alias XC="run-shell 'tmux save-buffer - | wl-copy -t text/plain > /dev/null'"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "wl-copy -t text/plain > /dev/null"

# :cheatsheet  ->  open the cheatsheet popup (same command the "?" click runs)
set -ag command-alias "cheatsheet=display-popup -E -w 88% -h 88% -b rounded -T ' tmux cheatsheet ' ~/.config/tmux/cheatsheet.sh"

set -g @continuum-restore 'on'
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style "rounded"
set -ag "@catppuccin_status_${MODULE_NAME}" "#{@catppuccin_${MODULE_NAME}_text}"

# saves live on the separate SSD so a root-NVMe drop can't take them; every 5 min
set -g @resurrect-dir '/mnt/safe/tmux-resurrect'
set -g @continuum-save-interval '5'

# Claude Code panes come back on their own session id after a reboot (claude-resurrect.sh)
set -g @resurrect-hook-post-save-layout '~/.config/tmux/claude-resurrect.sh save'
set -g @resurrect-processes '"claude->~/.config/tmux/claude-resurrect.sh restore"'

set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'

run '~/.tmux/plugins/tpm/tpm'

