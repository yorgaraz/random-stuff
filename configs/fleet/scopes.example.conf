# fleet: optional extras per Claude session name. Copy to ~/.config/fleet/scopes.conf (the real file is local only and
# never goes into the repo; the names below are made up).
#
# name              role    [always-on|-]   [effort|-]   [purpose text to the end of the line]
#   name     the Claude session name (what `claude -n` / the prompt box shows)
#   role     free label printed by the session start hook (dev, depl, ops ...); `-` for none (one word)
#   always-on  means ALWAYS AVAILABLE, not always running: after a reboot or a crash the watchdog and `fleet up` bring the
#            session back (at most 3 times an hour, then it tells you). The daemon puts an idle job to sleep after 60
#            minutes (a retire); the watchdog leaves such a session asleep, and any session wakes it with `fleet wake <name>`.
#   effort   low | medium | high | xhigh | max, or `-`: used by `fleet bg` / `fleet up` / `fleet wake` only when no effort
#            was recorded for the session (the conversation file and the hook record what /effort set); never the default
#   purpose  what the session is for: shown by `fleet who`, the directory every session can read (no `#` in it)
# `fleet new` appends a line here for every session it creates. The 4-column form (no purpose) still works.
#
# There is NO scope column: the entry of a Claude session is the tmux session its pane or viewer window is in, and an
# entry's members are all windows of that tmux session (see `fleet list`, `fleet stash`, `fleet peek`).
shop-dev          dev     -           -        Builds and tests the shop front end
shop-depl         depl
shop-ops          ops     always-on   high     Deploys and watches the shop; always available
blog-dev          dev
notes-assistant   -       always-on   medium   Keeps the notes tidy
