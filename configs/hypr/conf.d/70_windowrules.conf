# General
windowrule = match:class .*, suppress_event maximize

# Fix XWayland ghost windows
windowrule = match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0, no_focus on

# Opacity
windowrule = match:class ^(kitty)$, match:title ^(htop)$, opacity 0.8 0.8 0.8
windowrule = match:class ^(Kitty|jetbrains-.*|Code|beekeeper-studio|com.github.wwmm.easyeffects|1Password|Bitwarden|org.kde.dolphin|org.gnome.Nautilus|Pcmanfm)$, opacity 0.9 0.8 0.85
windowrule = match:class ^(Spotify)$, opacity 1.0 0.8
windowrule = match:tag ghost, opacity 0.9 0.8 0.85

# Floating Applications
windowrule = match:class ^(Genymotion|Genymotion Player|1Password|Bitwarden|zenity)$, float on

# Clipse and Hypremoji
windowrule = match:class (clipse), float on, size 622 652, center on
windowrule = match:class dev.musagy.hypremoji, float on, size 622 652, center on

# Network Manager
windowrule = match:class (nm-connection-editor), float on, size 600 400, center on

# Volume Control
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float on, size 800 600, center on

# Quake Terminal
windowrule = match:class ^(Kitty)$, match:title ^(quake-term)$, float on, size monitor_w*1 monitor_h*0.4, move 0 0, pin on

# Lutris
windowrule = match:class net.lutris.Lutris, float on

# Hyprland share picker
windowrule = match:class hyprland-share-picker, float on, size 600 400

# JetBrains IDEs
windowrule = match:class ^(jetbrains-.*)$, match:title ^(win\d+)$, no_initial_focus on
windowrule = match:class ^(jetbrains-.*)$, no_initial_focus on
windowrule = match:class ^(jetbrains-.*)$, match:title ^ $, stay_focused on

# rcmenu (GTA mod) offline overlay tests: Proton test windows must never steal focus from the fullscreen game
windowrule = match:class ^(steam_app_0)$, workspace special:rcmenutest silent, no_initial_focus on, no_focus on
windowrule = match:class ^(zenity)$, match:title ^(ProtonFixes)$, workspace special:rcmenutest silent, no_initial_focus on, no_focus on
# GTA V Enhanced (Proton): the Rockstar launcher must never share the game's workspace. With both on one workspace, Social Club's overlay crashes the game on its first frame (2026-11-03, proven by repro).
windowrule = match:class ^(steam_app_3312988118|steam_proton)$, match:title ^(Rockstar Games Launcher)$, workspace 5 silent
# GTA V Enhanced in Borderless: keep rendering at misc:render_unfocused_fps while another workspace is shown (2026-11-04)
windowrule = match:class ^(steam_app_3312988118|steam_proton)$, match:title ^(Grand Theft Auto V)$, render_unfocused on
